services:
  frontend:
    build:
      context: .
      args:
        # Full URL (scheme + host, no assumed port) — baked into the client
        # bundle at build time, so it must exactly match wherever the API is
        # actually reachable from a browser. Set API_URL in .env once you're
        # behind nginx/HTTPS instead of raw IP:port.
        NEXT_PUBLIC_API_BASE_URL: ${API_URL:-http://167.86.120.214:8082}
    image: riskyc-frontend:latest
    container_name: riskyc-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3001}:3000"
